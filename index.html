<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Scroll.io — AI-powered PDF summarizer with interactive mind maps" />
    <meta name="theme-color" content="#f7f7f7" />
    <title>Scroll.io — AI PDF Summarizer & Mind Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Prevent FOUC: set theme before React hydrates -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('scrollio_theme');
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          // Sync meta theme-color
          var tc = theme === 'light' ? '#F7F7FC' : '#0A0A0F';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = tc;
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
