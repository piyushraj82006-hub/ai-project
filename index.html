<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Scroll.io — AI-powered study companion with PDF summarizer, mind maps, academic calendar, and course management." />
    <meta name="theme-color" content="#fbfbfd" />
    <title>Scroll.io — Smart Study Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Prevent FOUC: set theme before React hydrates -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('scrollio_theme');
          if (!theme) {
            theme = 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          var tc = theme === 'light' ? '#fbfbfd' : '#0a0a0c';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.content = tc;
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
